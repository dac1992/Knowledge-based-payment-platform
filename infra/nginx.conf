# 研脉学术知识付费平台 — Nginx 配置模板
#
# 部署拓扑：
#   用户 ──HTTPS──> Nginx ──┬── /api/   ──> Go API 服务 (127.0.0.1:8080)
#                           ├── /health ──> Go API 服务
#                           └── /        ──> 前端静态资源（admin-web / lecturer-web / user-web）
#
# 使用方式：替换 __DOMAIN__ / __WEB_ROOT__ / __API_UPSTREAM__ 后放入 /etc/nginx/conf.d/

upstream yanmai_api {
    # 单实例；多实例时在此追加 server 行并启用负载均衡策略
    server __API_UPSTREAM__ max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/nginx/ssl/__DOMAIN__.crt;
    ssl_certificate_key /etc/nginx/ssl/__DOMAIN__.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 200m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # 后端接口
    location /api/ {
        proxy_pass http://yanmai_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://yanmai_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # 管理后台（单页应用，需回退到 index.html）
    location / {
        root __WEB_ROOT__/admin-web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /lecturer/ {
        alias __WEB_ROOT__/lecturer-web/;
        try_files $uri $uri/ /lecturer/index.html;
    }

    # 带哈希的静态资源长期缓存
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
        root __WEB_ROOT__/admin-web;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
