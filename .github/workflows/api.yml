name: API (Go)

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - '.github/workflows/api.yml'

defaults:
  run:
    working-directory: services/api

jobs:
  quality:
    name: 静态检查与单元测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/api/go.sum

      - name: 下载依赖
        run: go mod download

      - name: gofmt 格式检查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 编译
        run: go build ./...

      - name: 单元测试与覆盖率
        run: go test ./... -cover -race

  smoke:
    name: 端到端冒烟（真实 PostgreSQL）
    runs-on: ubuntu-24.04
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yanmai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: local
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/yanmai_ci?sslmode=disable
      JWT_SECRET: ci-secret-key-at-least-32-characters-long
      DB_AUTO_MIGRATE: 'true'
      DB_SEED: 'true'
      LOG_LEVEL: info

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/api/go.sum

      - name: 启动 API 服务
        run: |
          go build -o /tmp/yanmai-api ./cmd/server
          /tmp/yanmai-api > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/health/ready > /dev/null; then
              echo "服务已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "服务启动超时，日志如下："
          cat /tmp/api.log
          exit 1

      - name: 端到端冒烟
        run: bash scripts/smoke.sh

      - name: 失败时输出服务日志
        if: failure()
        run: cat /tmp/api.log
