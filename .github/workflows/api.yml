name: API (Go)

on:
  # 当前仅支持手动触发。GitHub 账号处于账单锁定状态，job 会在启动阶段即被拒绝
  # （官方 annotation: "The job was not started because your account is locked
  # due to a billing issue."），自动触发只会持续堆积失败记录。
  # 质量门禁已收敛到本地：pnpm verify（前端）+ make verify（后端）+ make smoke。
  # 账单问题解决后，若需恢复自动触发，取消下方注释即可。
  workflow_dispatch:

  # push:
  #   branches: [main, develop]
  #   paths:
  #     - 'services/api/**'
  #     - 'packages/api-client/src/generated/**'
  #     - '.github/workflows/api.yml'
  # pull_request:
  #   paths:
  #     - 'services/api/**'
  #     - 'packages/api-client/src/generated/**'
  #     - '.github/workflows/api.yml'

defaults:
  run:
    working-directory: services/api

jobs:
  quality:
    name: 静态检查与单元测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/api/go.sum

      # 版本与本地保持一致，避免「本地过、CI 挂」的偏差
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: services/api

      - name: 下载依赖
        run: go mod download

      - name: gofmt 格式检查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 编译
        run: go build ./...

      - name: 单元测试与覆盖率
        run: go test ./... -cover -race

  contract:
    name: OpenAPI 契约校验
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/api/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        working-directory: .
        run: pnpm install --frozen-lockfile

      # 从源码重新生成 swagger 文档与前端契约类型。
      # swag 版本必须与 services/api/Makefile 的 SWAG_VERSION 一致，
      # 否则生成结果出现无意义差异会导致本任务误报。
      - name: 重新生成契约产物
        working-directory: .
        run: |
          cd services/api
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init \
            -g cmd/server/main.go -o docs \
            --parseDependency --parseInternal --outputTypes json,yaml
          cd ../..
          pnpm --filter @yanmai/api-client gen:openapi

      # 后端改了接口但没同步前端类型 → 这里会红，强制开发者补上产物。
      - name: 校验契约产物已随代码提交
        working-directory: .
        run: |
          if ! git diff --quiet -- services/api/docs packages/api-client/src/generated; then
            echo "::error::OpenAPI 文档或前端契约类型与源码不一致。请本地执行 'cd services/api && make sdk'，并把生成产物一并提交。"
            git --no-pager diff --stat -- services/api/docs packages/api-client/src/generated
            exit 1
          fi
          echo "✓ 契约产物与源码一致"

  smoke:
    name: 端到端冒烟（真实 PostgreSQL）
    runs-on: ubuntu-24.04
    needs: quality

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yanmai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: local
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/yanmai_ci?sslmode=disable
      JWT_SECRET: ci-secret-key-at-least-32-characters-long
      DB_AUTO_MIGRATE: 'true'
      DB_SEED: 'true'
      LOG_LEVEL: info

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: services/api/go.sum

      - name: 启动 API 服务
        run: |
          go build -o /tmp/yanmai-api ./cmd/server
          /tmp/yanmai-api > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/health/ready > /dev/null; then
              echo "服务已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "服务启动超时，日志如下："
          cat /tmp/api.log
          exit 1

      - name: 端到端冒烟
        run: bash scripts/smoke.sh

      - name: 失败时输出服务日志
        if: failure()
        run: cat /tmp/api.log
